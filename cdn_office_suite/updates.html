<!doctype html><html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Updates · CDN Office Suite</title><link rel="icon" href="favicon.ico"><link rel="stylesheet" href="office.css"><script src="settings.js"></script><script src="connection.js"></script></head>
<body><header class="topbar"><div class="bar"><a class="brand" href="index.html"><img src="assets/images/cdn-logo-transparent.webp" alt="CDN"><span>Office Suite</span></a><nav aria-label="Office suite"><a href="index.html">Back to your tools</a><a href="/categories">Back to OC4D</a></nav></div></header>
<main><div class="intro"><span class="hello">A little tool care</span><h1>Software updates</h1><p>For your server’s superadmins.</p></div><div id="accessMessage" class="updates" role="status">Checking your OC4D login…</div><p id="connectionStatus" class="connection-status" role="status" hidden></p><div id="adminPanel" hidden></div></main>
<script>
const $=id=>document.getElementById(id), names={wordcraft:'Wordcraft',gridcraft:'Gridcraft',deckcraft:'Deckcraft',pdfcraft:'PDFcraft',vectorcraft:'Vectorcraft',cadcraft:'CADcraft',photocraft:'Photocraft'};
const connection=window.OFFICE_CONNECTION,service=connection&&!connection.error?new URL(connection.service):null;
let states={},operation=null,polling=null,denied=false,panelReady=false,connected=false,refreshPromise=null,initializing=false,submitting=false;
const checking=new Set(),active=s=>['queued','installing','retrying'].includes(s?.phase);
function token(){try{return localStorage.getItem('accessToken')||'';}catch(_){return '';}}
function deny(status){denied=true;clearTimeout(polling);$('adminPanel').hidden=true;$('adminPanel').replaceChildren();$('accessMessage').hidden=false;$('accessMessage').replaceChildren();const p=document.createElement('p');p.textContent=status===401?'Sign in to OC4D with a server superadmin account to access updates.':'Only server superadmins can manage software updates.';$('accessMessage').appendChild(p);if(status===401){const a=document.createElement('a');a.href='/authentication/sign-in';a.textContent='Sign in to OC4D';a.className='button secondary';$('accessMessage').appendChild(a);}}
function buttons(){const busy=Object.values(states).some(active)||checking.size>0||submitting;document.querySelectorAll('[data-action="check"],[data-action="review"],[data-action="rollback"],#approveButton').forEach(b=>b.disabled=!connected||busy);}
function setConnected(value){connected=value;$('connectionStatus').hidden=value;if(!value)$('connectionStatus').textContent='Connection paused. Showing the last known progress while we reconnect. Saved updates keep running on the server.';buttons();}
async function request(path,body,html=false){const r=await fetch(new URL('api/'+path,service),{method:body?'POST':'GET',headers:{Authorization:'Bearer '+token(),...(body?{'Content-Type':'application/json'}:{})},...(body?{body:JSON.stringify(body)}:{}),signal:AbortSignal.timeout(body?45000:9000),cache:'no-store'});if(r.status===401||r.status===403){deny(r.status);throw new Error('Superadmin access required');}if(!r.ok){const data=await r.json(),e=new Error(data.error||'Request failed');e.status=r.status;throw e;}return html?r.text():r.json();}
function message(app,text,error=false){const e=$(app+'-message');if(e){if(e.textContent!==text)e.textContent=text;e.dataset.error=String(error);}}
const stepNames={queued:'In the queue',validate:'Checking your version',download:'Downloading',verify:'Checking the download',unpack:'Unpacking',prepare:'Getting ready',activate:'Installing',waiting:'Download paused',done:'All done!',error:'Update stopped',installer:'Installer at work'};
function render(app,data){
 const old=states[app];if(old?.jobId&&active(old)&&!data.jobId)return;if(old?.jobId===data.jobId&&old?.updatedAt>data.updatedAt)return;
 states[app]=data;$(app+'-installed').textContent=data.installed||'Not installed';$(app+'-latest').textContent=data.latest?' · Latest '+data.latest:'';
 const busy=active(data);$(app+'-review').hidden=!data.available||busy;$(app+'-rollback').hidden=!data.previous||data.previous===data.installed||busy;$(app+'-notes').hidden=!data.notes;if(data.notes)$(app+'-notes').href=data.notes;
 if(busy||data.phase==='error'||data.phase==='complete')message(app,data.message,data.phase==='error');else if(data.latest)message(app,data.available?'A new version is ready to review.':'All caught up. You have the latest release.');else message(app,'Checking will not install anything.');
 const job=$(app+'-job');job.hidden=!data.jobId&&!busy;job.dataset.phase=data.phase;
 if(!job.hidden){$(app+'-step').textContent=stepNames[data.step]||'Working on your update';const bar=$(app+'-progress');if(Number.isFinite(data.progress)){bar.value=data.progress;$(app+'-percent').textContent=data.progress+'%';}else{bar.removeAttribute('value');$(app+'-percent').textContent='';}
 let detail=data.version?'Version '+data.version:'';if(data.step==='download'&&data.totalBytes)detail+=' · '+(data.downloadedBytes/1048576).toFixed(1)+' / '+(data.totalBytes/1048576).toFixed(1)+' MB';if(data.attempt>1)detail+=' · Attempt '+data.attempt;if(data.nextRetryAt)detail+=' · Next try '+new Date(data.nextRetryAt*1000).toLocaleTimeString();$(app+'-detail').textContent=detail;}
 buttons();
}
function refresh(){if(denied)return Promise.resolve();if(refreshPromise)return refreshPromise;clearTimeout(polling);refreshPromise=(async()=>{try{const data=await request('admin-status');setConnected(true);for(const [app,state] of Object.entries(data.apps))render(app,state);}catch(e){if(!denied)setConnected(false);}finally{refreshPromise=null;if(!denied)polling=setTimeout(refresh,Object.values(states).some(active)?2000:6000);}})();return refreshPromise;}
function review(app,rollback){if(!connected||Object.values(states).some(active))return;const state=states[app];operation={app,rollback,version:rollback?state.previous:state.latest};$('approvalTitle').textContent=(rollback?'Restore ':'Update ')+names[app];$('approvalText').textContent=rollback?`Restore ${state.installed} to ${operation.version}. The current version will be retained.`:`Install ${operation.version} over ${state.installed||'the missing installation'}. The server keeps going if you close this tab and retries if the download connection fails. This app stays unavailable until the job finishes.`;$('approveButton').textContent=rollback?'Approve and restore':'Approve and install';$('approvalForm').hidden=false;$('approveButton').focus();}
function bindPanel(){
 $('adminPanel').addEventListener('click',async event=>{const button=event.target.closest('button[data-action]');if(!button||!connected)return;const {app,action}=button.dataset;if(action==='review'||action==='rollback'){review(app,action==='rollback');return;}
 checking.add(app);buttons();const label=button.textContent;button.textContent='Checking…';$('approvalForm').hidden=true;message(app,'Checking the latest release…');try{render(app,await request('check',{app}));}catch(e){message(app,e.message,true);if(!e.status)setConnected(false);}finally{checking.delete(app);if(button.isConnected){button.textContent=label;buttons();}}
 });
 $('cancelButton').addEventListener('click',()=>{$('approvalForm').hidden=true;operation=null;});
 document.addEventListener('keydown',event=>{if(event.key==='Escape'&&$('approvalForm')&&!$('approvalForm').hidden){event.preventDefault();$('cancelButton').click();}});
 $('approvalForm').addEventListener('submit',async event=>{event.preventDefault();if(!operation||!connected||submitting)return;submitting=true;buttons();const selected=operation;$('approveButton').disabled=true;$('cancelButton').disabled=true;message(selected.app,'Saving your approval on the server…');
 try{render(selected.app,await request(selected.rollback?'rollback':'update',{app:selected.app,approved:true,version:selected.version}));$('approvalForm').hidden=true;operation=null;}
 catch(e){message(selected.app,e.status?e.message:'Checking whether the server received your approval. Reconnecting…',true);if(!e.status)setConnected(false);}
 finally{submitting=false;if($('cancelButton'))$('cancelButton').disabled=false;await refresh();buttons();}
 });
}
async function initialize(){if(initializing)return;initializing=true;if(!token()){deny(401);initializing=false;return;}try{if(!panelReady){$('adminPanel').innerHTML=await request('update-panel',null,true);panelReady=true;bindPanel();$('adminPanel').hidden=false;$('accessMessage').hidden=true;}await refresh();}catch(e){if(!denied){$('accessMessage').textContent='The server is taking a moment. Reconnecting automatically…';polling=setTimeout(initialize,5000);}}finally{initializing=false;}}
window.addEventListener('online',()=>{if(!denied){if(panelReady)refresh();else initialize();}});
window.addEventListener('storage',event=>{if(event.key==='accessToken')location.reload();});if(service)initialize();else{$('accessMessage').textContent=connection?.error||'Server port settings are unavailable. Ask your administrator to repair the installation.';denied=true;}
</script></body></html>
